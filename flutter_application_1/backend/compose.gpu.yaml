services:
  sanaa:
    build: .
    gpus: all
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      SANAA_DATA_DIR: /data
      SANAA_DEVICE: cuda
      SANAA_SAM_DEVICE: cpu
      SANAA_BASE_MODEL: /models/sdxl-base
      SANAA_CONTROLNET_MODEL: /models/controlnet-canny-sdxl
      SANAA_INPAINT_MODEL: /models/sdxl-inpainting
      SANAA_SAM_CHECKPOINT: /models/sam2.1_hiera_tiny.pt
    volumes: ["./data:/data", "./models:/models:ro"]
    restart: unless-stopped
